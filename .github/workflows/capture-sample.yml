name: Capture a real feed sample

# Builds the timetable baseline, records a few minutes of the live MTA feeds, runs the stream job on them
# (file mode) and commits a summary plus a compressed sample used for local development.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes of live feed to record
        default: "8"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Timetable baseline
        run: python -m subway.schedule
        env:
          PYTHONPATH: src
      - name: Record live feeds
        run: python -m subway.producer --minutes ${{ inputs.minutes }} --out data/capture
        env:
          PYTHONPATH: src
      - name: Run the stream job on the recording
        run: python -m subway.stream --source files --input data/capture --minutes 4
        env:
          PYTHONPATH: src
      - name: Summarise
        run: python scripts/summarise_capture.py data/capture data/stream 2>&1 | tee summary.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -f reports/capture_summary.json tests/fixtures/capture.jsonl.gz data/static/*.parquet
          git commit -m "Capture a live feed sample and timetable baseline" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: Keep the log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git checkout -B capture-log
          git add -f summary.log && git commit -qm log && git push -qf origin capture-log
